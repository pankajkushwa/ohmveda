<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="archGrad" x1="20" y1="20" x2="180" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>

    <linearGradient id="pcbGrad" x1="130" y1="20" x2="185" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <linearGradient id="vGrad" x1="60" y1="80" x2="140" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#03045E" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
  </defs>

  <!-- Outer Omega Arch -->
  <path
    d="M 22 152 H 54 C 54 82, 58 32, 100 32 C 142 32, 146 82, 146 152 H 178"
    stroke="url(#archGrad)"
    stroke-width="18"
    stroke-linecap="square"
    stroke-linejoin="miter"
    fill="none"
  />

  <!-- Inner V-Shape -->
  <path
    d="M 60 82 L 100 150 L 140 82"
    stroke="url(#vGrad)"
    stroke-width="18"
    stroke-linecap="square"
    stroke-linejoin="miter"
    fill="none"
  />

  <!-- Top Center PCB Pin & Terminal Dot -->
  <line
    x1="100"
    y1="72"
    x2="100"
    y2="42"
    stroke="#03045E"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <circle
    cx="100"
    cy="34"
    r="6.5"
    fill="#FFFFFF"
    stroke="#03045E"
    stroke-width="4"
  />

  <!-- Center Golden/Orange Lightning Bolt -->
  <path
    d="M 103 60 L 87 96 H 101 L 94 124 L 115 88 H 100 Z"
    fill="#FF9F00"
  />

  <!-- Top-Right PCB Traces -->
  <g
    stroke="url(#pcbGrad)"
    stroke-width="4.5"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M 128 50 L 146 28 H 156" />
    <circle cx="162" cy="28" r="4.5" fill="#FFFFFF" stroke="#00B4D8" stroke-width="3" />
    <circle cx="162" cy="28" r="1.5" fill="#00B4D8" />

    <path d="M 138 68 H 162" />
    <circle cx="168" cy="68" r="4.5" fill="#FFFFFF" stroke="#00B4D8" stroke-width="3" />
    <circle cx="168" cy="68" r="1.5" fill="#00B4D8" />

    <path d="M 140 86 L 154 100 H 166" />
    <circle cx="172" cy="100" r="4.5" fill="#FFFFFF" stroke="#00B4D8" stroke-width="3" />
    <circle cx="172" cy="100" r="1.5" fill="#00B4D8" />
  </g>
</svg>
